services:
  postgres:
    image: postgres:16-alpine
    container_name: op2p-white-label-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-op2p_white_label}
      POSTGRES_USER: ${POSTGRES_USER:-op2p_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-op2p_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
